steps:
  # build the container images
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--build-arg",
        "GOOGLE_CLIENT_ID=$_GOOGLE_CLIENT_ID",
        "--build-arg",
        "VERTEX_CLIENT_EMAIL=$_VERTEX_CLIENT_EMAIL",
        "--build-arg",
        "NEXT_PUBLIC_BASE_URL=$_NEXT_PUBLIC_BASE_URL",
        "--build-arg",
        "FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID",
        "--build-arg",
        "FIREBASE_CLIENT_EMAIL=$_FIREBASE_CLIENT_EMAIL",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_API_KEY=$_NEXT_PUBLIC_FIREBASE_API_KEY",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_NEXT_PUBLIC_FIREBASE_PROJECT_ID",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_APP_ID=$_NEXT_PUBLIC_FIREBASE_APP_ID",
        "--build-arg",
        "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=$_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID",
        "--build-arg",
        "CLASSROOM_CLIENT_ID=$_CLASSROOM_CLIENT_ID",
        "--build-arg",
        "CLASSROOM_REDIRECT_URI=$_CLASSROOM_REDIRECT_URI",
        "-t",
        "asia-southeast1-docker.pkg.dev/$PROJECT_ID/web/reading-advantage-web",
        "./web",
      ]

  # push the container images to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "asia-southeast1-docker.pkg.dev/$PROJECT_ID/web/reading-advantage-web"]

  # Deploy container images to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "reading-advantage-web",
        "--image",
        "asia-southeast1-docker.pkg.dev/$PROJECT_ID/web/reading-advantage-web",
        "--timeout=60m",
        "--region",
        "asia-southeast1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--add-cloudsql-instances",
        "$_CLOUD_SQL_CONNECTION_NAME",
        "--set-env-vars",
        "NODE_ENV=production,NEXTAUTH_URL=$_NEXTAUTH_URL,NEXT_PUBLIC_BASE_URL=$_NEXT_PUBLIC_BASE_URL,AUTH_GOOGLE_ID=$_GOOGLE_CLIENT_ID,FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID,VERTEX_CLIENT_EMAIL=$_VERTEX_CLIENT_EMAIL,FIREBASE_CLIENT_EMAIL=$_FIREBASE_CLIENT_EMAIL,CLASSROOM_CLIENT_ID=$_CLASSROOM_CLIENT_ID,CLASSROOM_REDIRECT_URI=$_CLASSROOM_REDIRECT_URI",
        "--set-secrets",
        "DATABASE_URL=ra-web-database-url:latest,NEXTAUTH_SECRET=ra-web-nextauth-secret:latest,AUTH_GOOGLE_SECRET=ra-web-auth-google-secret:latest,VERTEX_PRIVATE_KEY=ra-web-vertex-private-key:latest,OPENAI_API_KEY=ra-web-openai-api-key:latest,ACCESS_KEY=ra-web-access-key:latest,DISCORD_WEBHOOK_URL=ra-web-discord-webhook-url:latest,GOOGLE_TEXT_TO_SPEECH_API_KEY=ra-web-google-text-to-speech-api-key:latest,FIREBASE_PRIVATE_KEY=ra-web-firebase-private-key:latest,CLASSROOM_CLIENT_SECRET=ra-web-classroom-client-secret:latest,SERVICE_ACCOUNT_KEY=ra-web-service-account-key:latest",
      ]

  # Send a notification to Discord
  # - name: "gcr.io/cloud-builders/curl"
  #   args:
  #     [
  #       "-X",
  #       "POST",
  #       "-H",
  #       "Content-Type: application/json",
  #       "-d",
  #       '{"content": "# Build results \n**project id**: $PROJECT_ID"',
  #       "$DISCORD_WEBHOOK_URL",
  #     ]

images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/web/reading-advantage-web

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
